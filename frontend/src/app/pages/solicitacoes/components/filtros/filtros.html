<div class="filtros-header">
  <div>
    <span class="filtros-eyebrow">CONSULTA</span>
    <h3>Filtros</h3>
    <p>Refine a busca pelas solicitações cadastradas.</p>
  </div>

  <div class="filtros-icon">☰</div>
</div>

<div class="filtros-grid">
  <div class="form-group filtro-titulo">
    <label for="filtro-titulo">Título</label>

    <input id="filtro-titulo" type="text" placeholder="Buscar por título" [(ngModel)]="titulo" />
  </div>

  <div class="form-group">
    <label for="filtro-categoria">Categoria</label>

    <select id="filtro-categoria" [(ngModel)]="categoria">
      <option value="">Todas as categorias</option>

      @for (categoria of categorias; track categoria.value) {
        <option [value]="categoria.value">
          {{ categoria.label }}
        </option>
      }
    </select>
  </div>

  <div class="form-group">
    <label for="filtro-status">Status</label>

    <select id="filtro-status" [(ngModel)]="status">
      <option value="">Todos os status</option>

      @for (status of statuses; track status.value) {
        <option [value]="status.value">
          {{ status.label }}
        </option>
      }
    </select>
  </div>

  <div class="form-group">
    <label for="data-inicio">Data inicial</label>

    <input id="data-inicio" type="date" [(ngModel)]="data_inicio" />
  </div>

  <div class="form-group">
    <label for="data-fim">Data final</label>

    <input id="data-fim" type="date" [(ngModel)]="data_fim" />
  </div>

  <div class="filtros-footer">
    <span class="filtros-info"> Use os campos acima para refinar os resultados. </span>

    <div class="filtros-acoes">
      <button type="button" class="btn-limpar" (click)="limparFiltros()">Limpar filtros</button>

      <button type="button" class="btn-filtrar" (click)="aplicarFiltros()">
        <span>⌕</span>
        Filtrar
      </button>
    </div>
  </div>
</div>
